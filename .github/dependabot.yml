# Keeps the workflows' actions current: one grouped pull request a month when any action has a new
# version, at least a week after its release. Vulnerable NuGet packages are left to Dependabot's
# security updates (switched on in the repository's settings).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
